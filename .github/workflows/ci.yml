name: CI

# Runs on every PR and on main. Competition data is not in the repo (and must not be), so CI checks
# what can be checked without it: lint, unit tests (data-dependent tests skip), repo hygiene, Docker build.
# Accuracy (eval dev / holdout) is still run locally and reported in the PR description.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.14.4
      - run: ruff check src eval analysis tests --output-format github

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests -q

  hygiene:
    name: Repo hygiene (no competition data, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No files under data/ and no archives tracked
        run: |
          bad=$(git ls-files | grep -E '^data/|\.zip$|questions\.jsonl$|answers\.jsonl$' || true)
          if [ -n "$bad" ]; then echo "::error::Competition data must not be committed:"; echo "$bad"; exit 1; fi
      - name: No tracked file larger than 1 MB
        run: |
          big=$(git ls-files -z | xargs -0 du -k | awk '$1 > 1024 {print}' || true)
          if [ -n "$big" ]; then echo "::error::Large files:"; echo "$big"; exit 1; fi
      - name: No obvious tokens
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|hf_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "::error::Possible secret committed"; exit 1; fi

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      # The real image ships data/train/train; CI has no data, so build against an empty placeholder.
      - run: mkdir -p data/train/train && touch data/train/train/.placeholder
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: datamate:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test entrypoint and imports (no network)
        run: |
          docker run --rm --network none --entrypoint bash datamate:ci -c \
            'test -x /code/predict.sh && test -f /code/training_code/data_manifest.json \
             && python -c "import datamate.run, datamate.pipeline; print(\"ok\")"'
