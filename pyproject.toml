[project]
name = "datamate"
version = "0.0.1"
description = "DataMate agent - Zalo AI Challenge 2026"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "python-calamine>=0.2",
  "duckdb>=1.0",
  "pyarrow",
  "python-dateutil",
  "unidecode",
  "rapidfuzz",
]

[project.optional-dependencies]
dev = ["pytest", "tqdm"]
llm = ["vllm"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
