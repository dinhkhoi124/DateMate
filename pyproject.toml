[project]
name = "datamate"
version = "0.0.1"
description = "DataMate agent - Zalo AI Challenge 2026"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "python-calamine>=0.2",
  "duckdb>=1.0",
  "pyarrow",
  "python-dateutil",
  "unidecode",
  "rapidfuzz",
]

[project.optional-dependencies]
dev = ["pytest", "tqdm", "ruff==0.14.4", "pre-commit"]
llm = ["vllm"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "cache", "eval/runs", "eval/synth/out", "analysis/out"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors (ruff default). E741: short names like `l` are used deliberately in table code.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
